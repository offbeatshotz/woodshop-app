<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Woodshop App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <button id="show-planner">Project Planner</button>
    <button id="show-identifier">Wood Identifier</button>
  </nav>

  <div id="planner-section">
    <h1>Project Planner</h1>
    <div class="controls">
      <input type="text" id="search-bar" placeholder="Search projects...">
      <select id="sort-by">
        <option value="name-asc">Sort by Name (A-Z)</option>
        <option value="name-desc">Sort by Name (Z-A)</option>
        <option value="status">Sort by Status</option>
      </select>
    </div>
    <div class="add-project-form">
      <input type="text" id="new-project-name" placeholder="Enter new project name">
      <button id="add-project-button">Add Project</button>
    </div>
    <ul id="project-list"></ul>
  </div>

  <div id="identifier-section" style="display: none;">
    <h1>Wood Identifier</h1>
    <div class="identifier-controls">
      <button id="start-camera-button">Start Camera</button>
      <input type="file" id="image-upload" accept="image/*" style="display: none;">
      <label for="image-upload" class="file-upload-label">Upload Image</label>
    </div>
    <video id="camera-feed" width="300" height="300" autoplay playsinline style="display: none;"></video>
    <button id="snap-photo-button" style="display: none;">Snap Photo</button>
    <img id="image-preview" src="" alt="Image Preview" style="display: none; max-width: 300px; margin-top: 10px;">
    <div id="prediction-result"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@latest/dist/mobilenet.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
